<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Missão Reciclagem</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <h1>🌱 Missão Reciclagem</h1>

        <p class="descricao">
            Colete os recicláveis e fuja da poluição.
        </p>

        <div class="informacoes">
            <span id="pontuacao">
                Recicláveis: 0/25
            </span>

            <span id="vidas">
                Vidas: 3
            </span>
        </div>

        <canvas
            id="jogo"
            width="1000"
            height="600"
        ></canvas>

        <p class="instrucoes">
            Arraste o joystick para movimentar o personagem.
            Também é possível usar as setas ou as teclas WASD.
        </p>

        <div
            id="joystick"
            class="joystick"
            aria-label="Controle de movimento"
        >
            <div
                id="joystick-bola"
                class="joystick-bola"
            ></div>
        </div>

        <button
            id="reiniciar"
            class="botao-reiniciar"
            type="button"
        >
            Reiniciar jogo
        </button>
    </main>

    <script src="script.js"></script>
</body>
</html>
