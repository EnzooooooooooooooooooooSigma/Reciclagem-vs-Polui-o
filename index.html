<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Missão Reciclagem</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <h1>🌱 Missão Reciclagem</h1>

        <p>
            Colete os recicláveis e evite o lixo tóxico.
        </p>

        <div class="informacoes">
            <span id="pontuacao">Recicláveis: 0/10</span>
            <span id="vidas">Vidas: 3</span>
        </div>

        <canvas id="jogo" width="700" height="450"></canvas>

        <p class="instrucoes">
            Use as setas do teclado ou as teclas WASD.
        </p>

        <button id="reiniciar">Reiniciar jogo</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
